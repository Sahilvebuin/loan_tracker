services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan_calculator_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Faster/cleaner than APT_MIRROR: set hostname only (rewrites main + security), e.g. APT_DEBIAN_HOST=mirrors.aliyun.com in .env
        APT_DEBIAN_HOST: ${APT_DEBIAN_HOST:-}
        APT_MIRROR: ${APT_MIRROR:-}
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      BUNDLE_WITHOUT: ""
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: loan_calculator_development
      DB_NAME_TEST: loan_calculator_test
    volumes:
      - .:/rails:cached
      - bundle:/usr/local/bundle
      - node_modules:/rails/node_modules
      - tmp:/rails/tmp
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    depends_on:
      - db

volumes:
  bundle:
  node_modules:
  tmp:
  pgdata:

